[package]
name = "deckontroller"
version = "1.0.0"
edition = "2021"
description = "Transparent USB-HID proxy: mirrors the Steam Deck's internal controller onto a USB gadget interface so a second PC's Steam client sees a genuine Steam Deck Controller (full Steam Input: trackpads, gyro, rear buttons)."
license = "GPL-3.0-or-later"
authors = ["Mara Broda (coderobe) <git@coderobe.net>"]

[[bin]]
name = "deckontroller"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
panic = "abort"
strip = true
